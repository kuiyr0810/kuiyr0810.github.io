<script>
  (function() {
    const { createApp } = Vue;
    const API_URL = 'https://status.5200810.xyz/'; 

    const App = {
      template: '#status-template',
      data() {
        return {
          monitors: [],
          loading: true,
          error: null,
          lastUpdated: '-'
        }
      },
      computed: {
        allOperational() {
          return this.monitors.every(m => m.status === 2);
        }
      },
      methods: {
        async fetchData() {
          // await new Promise(r => setTimeout(r, 1500)); // 测试骨架屏用
          try {
            const res = await fetch(API_URL);
            const data = await res.json();
            if (data.stat === 'ok') {
              this.monitors = data.monitors;
              this.lastUpdated = new Date().toLocaleString();
            } else {
              throw new Error(data.error?.message || 'API Error');
            }
          } catch (e) {
            this.error = '无法连接监控服务';
            console.error(e);
          } finally {
            this.loading = false;
          }
        },
        getHistoryBars(monitor) {
          const maxBars = 30; 
          let rawData = monitor.response_times || [];
        
          let recentData = rawData.slice(0, maxBars).reverse();

          while (recentData.length < maxBars) {
              recentData.unshift(null);
          }
          return recentData.map(rt => {
              if (!rt) {
                  return { className: 'no-data', tooltip: '无数据' };
              }
              const isUp = rt.value > 0;
              const date = new Date(rt.datetime * 1000).toLocaleString();
              return {
                  className: isUp ? 'bar-green' : 'bar-red',
                  tooltip: `${date}\n响应时间: ${rt.value}ms`
              };
          });
        },
        getStatusBadgeClass(status) {
            if (status === 2) return 'badge-green';
            if (status === 8 || status === 9) return 'badge-red';
            return 'badge-gray';
        },
        getStatusText(status) {
            const map = { 0: '已暂停', 1: '未检测', 2: '运行正常', 8: '疑似故障', 9: '服务中断' };
            return map[status] || '未知';
        },
        getRatio(str, idx) {
          if (!str) return '100.00';
          return parseFloat(str.split('-')[idx]).toFixed(2);
        },
        getLastResponseTime(m) {
          return (m.response_times && m.response_times.length && m.response_times[0].value > 0) 
            ? parseInt(m.response_times[0].value) 
            : '-';
        }
      },
      mounted() {
        this.fetchData();
      }
    };

    const init = () => {
      const el = document.getElementById('status-app');
      if (el && !el.__vue_app__) {
        createApp(App).mount('#status-app');
      }
    };
    init();
    document.addEventListener('pjax:complete', init);
  })();
</script>
