        try {
            const finalUrl = API_BASE.replace(/\/$/, '') + '/' + type;
            const res = await fetch(finalUrl);
            const json = await res.json();

            if (json.code === 200) {
                renderDailyHotList(json.data);
            } else {
                listRoot.innerHTML = `<div class="dh-loading"><div class="dh-msg-text">❌ 获取失败: ${json.message}</div></div>`;
            }
        } catch (err) {
            console.error(err);
            listRoot.innerHTML = `<div class="dh-loading"><div class="dh-msg-text">❌ 暂时下线</div></div>`;
        }
    };

    window.renderDailyHotList = function(data) {
        const listRoot = document.getElementById('dhListRoot');
      
        // 重置动画
        listRoot.style.animation = 'none';
        listRoot.offsetHeight; /* trigger reflow */
        listRoot.style.animation = 'fadeInUp 0.5s ease forwards';

        if(!data || data.length === 0) {
            listRoot.innerHTML = '<div class="dh-loading"><div class="dh-msg-text">📭 暂无数据</div></div>';
            return;
        }

        let html = '';
        data.forEach((item, index) => {
            const rank = index + 1;
            const link = item.mobileUrl || item.url || '#';
            const hotVal = item.hot ? `<span class="dh-hot-tag">🔥 ${item.hot}</span>` : '';
          
            let cardClass = 'dh-card-item';
            if(rank === 1) cardClass += ' rank-1';
            if(rank === 2) cardClass += ' rank-2';
            if(rank === 3) cardClass += ' rank-3';

            html += `
                <a href="${link}" target="_blank" class="${cardClass}">
                    <div class="dh-rank-num">${rank}</div>
                    <div class="dh-content">
                        <div class="dh-item-title" title="${item.title}">${item.title}</div>
                        <div class="dh-item-meta">
                            ${hotVal}
                            <span style="margin-left:auto; opacity:0.5; font-size:11px;">UP →</span>
                        </div>
                    </div>
                </a>
            `;
        });
        listRoot.innerHTML = html;
    }
</script>
